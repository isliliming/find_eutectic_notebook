[package]
name = "eutectic_lab_notebook"
version = "1.0.2"
edition = "2021"

[[bin]]
name = "eutectic-lab-notebook-v1-0-2"
path = "src/main.rs"

[dependencies]
eframe = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
rfd = "0.14"
